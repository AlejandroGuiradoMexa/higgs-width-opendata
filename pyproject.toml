[project]
name = "hwidth"
version = "0.1.0"
description = "Higgs boson width studies with ATLAS Open Data"
requires-python = ">=3.11"
dependencies = ["uproot", "awkward", "numpy", "pandas", "pyarrow", "pyhf", "iminuit", "scipy", "matplotlib", "mplhep", "atlasopenmagic"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
